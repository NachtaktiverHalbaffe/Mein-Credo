name: Upload to Nextcloud

on:
  push:
    branches:
      - main   # oder dein Branch

jobs:
  upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Upload file to Nextcloud via WebDAV
        env:
          NEXTCLOUD_USER: ${{ secrets.NEXTCLOUD_USER }}
          NEXTCLOUD_APP_PASSWORD: ${{ secrets.NEXTCLOUD_APP_PASSWORD }}
        run: |
          if [ -z "$NEXTCLOUD_USER" ]; then
            echo "::error::GitHub Actions secret NEXTCLOUD_USER is missing or empty."
            exit 1
          fi
          if [ -z "$NEXTCLOUD_APP_PASSWORD" ]; then
            echo "::error::GitHub Actions secret NEXTCLOUD_APP_PASSWORD is missing or empty."
            exit 1
          fi

          curl --fail-with-body --silent --show-error \
            --user "$NEXTCLOUD_USER:$NEXTCLOUD_APP_PASSWORD" \
            -T "Mein Credo.pdf" \
            "https://cloud.lemonkay.de/remote.php/dav/files/$NEXTCLOUD_USER/Privat/Mein%20Credo/Mein%20Credo.pdf"
